<!-- ============================================================
     PREDICT-CHECK WIDGET  (injected on every page via _quarto.yml)
     Turns  ::: {.predict-check data-answer="..."}  divs into an
     interactive "type your prediction → check" box.
     Just runs with html code, to make it simple and works with 
     GitHub Pages and offline.
     ============================================================ -->
<style>
.predict-check {
  border: 1.5px solid var(--ink, #14213d);
  border-left: 5px solid var(--accent, #fca311);
  border-radius: 8px;
  padding: 1rem 1.2rem;
  margin: 1.2rem 0;
  background: #fdf8ee;
}
.predict-check .pc-label {
  color: var(--accent-dark, #b87700);
  font-weight: 700;
  font-size: 0.85rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 0.4rem;
}
.predict-check .pc-ui { margin-top: 0.7rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
.predict-check input.pc-input, .predict-check textarea.pc-input {
  flex: 1 1 220px;
  font-family: var(--bs-font-monospace, monospace);
  font-size: 0.95rem;
  padding: 0.45rem 0.6rem;
  border: 1px solid #d5d0c3;
  border-radius: 6px;
}
.predict-check textarea.pc-input { min-height: 4.5rem; }
.predict-check button.pc-btn {
  background: var(--ink, #14213d); color: #fff; border: none; border-radius: 6px;
  padding: 0.45rem 1rem; font-weight: 600; cursor: pointer;
}
.predict-check button.pc-btn:disabled { background: #9aa5b8; cursor: not-allowed; }
.predict-check button.pc-reveal {
  background: #fff; color: var(--ink, #14213d); border: 1.5px solid var(--ink, #14213d);
  border-radius: 6px; padding: 0.45rem 1rem; font-weight: 600; cursor: pointer;
}
.predict-check .pc-feedback { margin-top: 0.6rem; font-size: 0.95rem; display: none; border-radius: 6px; padding: 0.55rem 0.8rem; }
.predict-check .pc-feedback.pc-wrong { display: block; background: #fdf0ef; color: #8a2d23; border: 1px solid #f3c9c4; }
.predict-check .pc-feedback.pc-right { display: block; background: #eef7ee; color: #1d5c2f; border: 1px solid #c4e3c8; }
.predict-check .pc-explanation {
  display: none; margin-top: 0.8rem; padding-top: 0.8rem; border-top: 1px dashed #d5d0c3;
}
.predict-check .pc-hint { display: none; }
.predict-check.pc-done input.pc-input, .predict-check.pc-done textarea.pc-input { background: #f3efe4; }

/* ---- dark-mode (Quarto toggles body.quarto-dark) ---- */
body.quarto-dark .predict-check { background: #1b2437; border-color: #2b3a52; border-left-color: var(--accent, #fca311); }
body.quarto-dark .predict-check .pc-label { color: var(--accent, #fca311); }
body.quarto-dark .predict-check input.pc-input,
body.quarto-dark .predict-check textarea.pc-input {
  background: #111827; color: #e7ebf5; border-color: #2b3a52;
}
body.quarto-dark .predict-check button.pc-btn { background: var(--accent, #fca311); color: #14213d; }
body.quarto-dark .predict-check button.pc-btn:disabled { background: #2b3a52; color: #6b7690; }
body.quarto-dark .predict-check button.pc-reveal { background: transparent; color: var(--accent, #fca311); border-color: var(--accent, #fca311); }
body.quarto-dark .predict-check .pc-feedback.pc-wrong { background: #3a1f1c; color: #f0b3aa; border-color: #6e3a33; }
body.quarto-dark .predict-check .pc-feedback.pc-right { background: #1c3320; color: #a8dcb0; border-color: #33663c; }
body.quarto-dark .predict-check .pc-explanation { border-top-color: #2b3a52; }
body.quarto-dark .predict-check.pc-done input.pc-input,
body.quarto-dark .predict-check.pc-done textarea.pc-input { background: #1b2437; }
</style>
<script>
(function () {
  "use strict";

  // --- matching logic -------------------------------------------------
  function norm(s) { return String(s).replace(/\s+/g, " ").trim(); }
  function stripQuotes(s) { return String(s).trim().replace(/^["'\u2018\u2019\u201C\u201D]+|["'\u2018\u2019\u201C\u201D]+$/g, ""); }
  function isCorrect(input, candidates) {
    var n = norm(input);
    return candidates.some(function (c) { return n === c; });
  }
  // Built-in near-miss detectors: return a hint string or null.
  function builtinHint(input, candidates) {
    var n = norm(input);
    if (candidates.some(function (c) { return norm(stripQuotes(n)) === c && n !== c; }))
      return "Close, but look again: are the quotation marks part of what gets printed?";
    if (candidates.some(function (c) { return n.toLowerCase() === c.toLowerCase() && n !== c; }))
      return "Almost, check upper- versus lowercase. Python prints text exactly as it is.";
    if (candidates.some(function (c) { return n.replace(/\s+/g, "") === c.replace(/\s+/g, "") && n !== c; }))
      return "Very close, count the spaces carefully.";
    return null;
  }

  function init() {
    var boxes = document.querySelectorAll(".predict-check");
    Array.prototype.forEach.call(boxes, function (box) {
      if (box.dataset.pcInit) return;
      box.dataset.pcInit = "1";

      var answer = box.getAttribute("data-answer") || "";
      var accept = (box.getAttribute("data-accept") || "").split("||").filter(function (x) { return x.length; });
      var candidates = [answer].concat(accept).map(norm);
      var multiline = box.getAttribute("data-multiline") === "true";
      var maxAttempts = parseInt(box.getAttribute("data-attempts") || "3", 10);

      var explanation = box.querySelector(".pc-explanation");
      var hints = Array.prototype.slice.call(box.querySelectorAll(".pc-hint"));

      // header label
      var label = document.createElement("div");
      label.className = "pc-label";
      label.textContent = "\uD83D\uDD2E Predict first";
      box.insertBefore(label, box.firstChild);

      // input + buttons
      var ui = document.createElement("div");
      ui.className = "pc-ui";
      var input = document.createElement(multiline ? "textarea" : "input");
      input.className = "pc-input";
      input.setAttribute("placeholder", box.getAttribute("data-placeholder") || "Type your prediction, then check\u2026");
      input.setAttribute("aria-label", "Your prediction");
      if (!multiline) input.setAttribute("type", "text");
      var btn = document.createElement("button");
      btn.className = "pc-btn";
      btn.type = "button";
      btn.textContent = "Check";
      btn.disabled = true;
      var reveal = document.createElement("button");
      reveal.className = "pc-reveal";
      reveal.type = "button";
      reveal.textContent = "Show the answer";
      reveal.style.display = "none";
      ui.appendChild(input); ui.appendChild(btn); ui.appendChild(reveal);

      var feedback = document.createElement("div");
      feedback.className = "pc-feedback";

      // keep explanation last
      if (explanation) { box.appendChild(explanation); }
      box.appendChild(ui);
      box.insertBefore(feedback, explanation || null);

      var attempts = 0;
      function finish(correct) {
        box.classList.add("pc-done");
        input.disabled = true; btn.disabled = true; reveal.style.display = "none";
        if (explanation) explanation.style.display = "block";
        feedback.className = "pc-feedback " + (correct ? "pc-right" : "pc-wrong");
        feedback.textContent = correct
          ? "\u2713 Correct! Well predicted. Now run it and watch it happen."
          : "Compare the answer below with what you predicted. The difference is the interesting part.";
      }

      input.addEventListener("input", function () { btn.disabled = norm(input.value).length === 0; });
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !multiline && !btn.disabled) { e.preventDefault(); btn.click(); }
      });
      reveal.addEventListener("click", function () { finish(false); });

      btn.addEventListener("click", function () {
        var val = input.value;
        if (isCorrect(val, candidates)) { finish(true); return; }
        attempts += 1;

        // author-provided hints first (first match wins)
        var msg = null;
        for (var i = 0; i < hints.length; i++) {
          var needle = hints[i].getAttribute("data-if-contains");
          if (needle && val.indexOf(needle) !== -1) { msg = hints[i].textContent.trim(); break; }
        }
        if (!msg) msg = builtinHint(val, candidates);
        if (!msg) msg = "Not quite. Read the code once more. What exactly will it give you?";

        var left = maxAttempts - attempts;
        feedback.className = "pc-feedback pc-wrong";
        feedback.textContent = msg;
        if (left <= 0) reveal.style.display = "inline-block";
      });
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
